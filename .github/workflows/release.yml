name: Release

# Push a tag like v1.0.0 and this builds the exe and attaches it to a release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:      # or run it by hand from the Actions tab

permissions:
  contents: write         # needed to create the release

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Small download, but the machine needs the .NET Desktop Runtime.
      - name: Publish (framework-dependent)
        run: >
          dotnet publish src/GpgCursorPatcher -c Release
          -p:PublishSingleFile=true -p:SelfContained=false
          -o publish/framework-dependent

      # Bigger, but runs on a machine with no .NET installed at all.
      - name: Publish (self-contained)
        run: >
          dotnet publish src/GpgCursorPatcher -c Release
          -p:PublishSingleFile=true -p:SelfContained=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish/self-contained

      - name: Name the two builds apart
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item publish/framework-dependent/GpgCursorPatcher.exe dist/GpgCursorPatcher.exe
          Copy-Item publish/self-contained/GpgCursorPatcher.exe dist/GpgCursorPatcher-standalone.exe
          Get-ChildItem dist | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          draft: true       # look it over, then publish from the Releases page
          generate_release_notes: true
          files: |
            dist/GpgCursorPatcher.exe
            dist/GpgCursorPatcher-standalone.exe
